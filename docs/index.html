<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FFCamp Notes</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --paper:#f5f0e6; --ink:#111111; --side:#fffdf5;
    --yellow:#ffd93d; --pink:#ff90b3; --lime:#b8f1a5; --blue:#9bd1ff; --orange:#ffab5e;
    --muted:#555; --side-w:280px;
    --bw:4px; --shadow:7px 7px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font:14.5px/1.55 "Archivo Black",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:600; background:var(--paper); color:var(--ink);
    display:flex; overflow:hidden;
  }

  /* ================= sidebar ================= */
  #sidebar {
    width:var(--side-w); min-width:var(--side-w); background:var(--side);
    border-right:var(--bw) solid var(--ink); display:flex; flex-direction:column; height:100vh;
  }
  #side-head {
    padding:14px 14px 10px; border-bottom:var(--bw) solid var(--ink);
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
    display:flex; align-items:center; justify-content:space-between; background:var(--yellow);
  }
  #tree { flex:1; overflow:auto; padding:8px 6px; font-size:13.5px; }
  #tree ul { list-style:none; }
  #tree ul ul { padding-left:15px; border-left:2px dashed var(--ink); margin-left:10px; }
  .row {
    display:flex; align-items:center; gap:7px; padding:4px 8px; cursor:pointer;
    white-space:nowrap; user-select:none; position:relative; border:2px solid transparent;
  }
  .row:hover { background:var(--yellow); border:2px solid var(--ink); }
  .row.sel { background:var(--pink); border:2px solid var(--ink); box-shadow:var(--shadow-sm); }
  .row .chev { width:12px; text-align:center; font-size:10px; flex:none; }
  .row .ico { flex:none; }
  .row .nm { overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .row .acts { margin-left:auto; display:none; gap:2px; }
  .row:hover .acts { display:flex; }
  .acts button {
    background:var(--side); border:2px solid var(--ink); cursor:pointer; font-size:11px;
    padding:1px 4px; box-shadow:2px 2px 0 var(--ink);
  }
  .acts button:active { transform:translate(2px,2px); box-shadow:none; }
  #side-foot { border-top:var(--bw) solid var(--ink); padding:10px; display:flex; gap:8px; background:var(--side); }
  #side-foot button {
    flex:1; cursor:pointer; font-family:inherit; font-weight:800; font-size:12px;
    border:3px solid var(--ink); padding:8px 4px; box-shadow:var(--shadow-sm);
    transition:transform .06s, box-shadow .06s;
  }
  #b-newfile { background:var(--lime); }
  #b-newdir { background:var(--blue); }
  #b-token { flex:0 0 46px !important; background:var(--orange); }
  #side-foot button:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  #side-foot button:active { transform:translate(3px,3px); box-shadow:none; }

  /* ================= main ================= */
  #main { flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; }
  #topbar {
    display:flex; align-items:center; gap:12px; padding:11px 18px;
    border-bottom:var(--bw) solid var(--ink); background:var(--side);
  }
  #burger { display:none; background:var(--yellow); border:3px solid var(--ink); box-shadow:var(--shadow-sm); color:var(--ink); border-radius:0; padding:4px 10px; cursor:pointer; font-size:14px; font-family:inherit; font-weight:800; }
  #crumb { flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  #crumb b { background:var(--ink); color:var(--yellow); padding:2px 8px; margin-right:4px; }
  .tbtn {
    background:var(--side); color:var(--ink); border:3px solid var(--ink); border-radius:0;
    padding:6px 13px; cursor:pointer; font-size:12.5px; white-space:nowrap; font-family:inherit;
    font-weight:800; box-shadow:var(--shadow-sm); transition:transform .06s, box-shadow .06s;
  }
  .tbtn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  .tbtn:active { transform:translate(3px,3px); box-shadow:none; }
  .tbtn.primary { background:var(--lime); }
  .tbtn.danger { background:var(--pink); }

  #view { flex:1; overflow:auto; }

  /* welcome */
  .welcome h2 { font-size:24px; margin-bottom:14px; text-transform:uppercase; }
  .welcome p { margin:10px 0; max-width:640px; }
  .welcome code { background:var(--ink); color:var(--yellow); padding:2px 8px; font-size:12.5px; font-weight:800; }

  /* markdown sections — neubrutalist slabs */
  #md { max-width:920px; margin:0 auto; padding:30px 26px 100px; position:relative; }
  .nb {
    border:var(--bw) solid var(--ink); box-shadow:var(--shadow);
    padding:26px 28px; margin-bottom:0; background:var(--side);
  }
  .nb.orig { background:var(--yellow); transform:rotate(-0.35deg); }
  .nb.summ { background:var(--pink); transform:rotate(0.35deg); }
  .divider {
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin:26px 0; font-size:13px; letter-spacing:2px; text-transform:uppercase;
    color:var(--paper);
  }
  .divider::before, .divider::after {
    content:""; flex:1; height:6px; background:repeating-linear-gradient(45deg,var(--ink),var(--ink) 10px,var(--yellow) 10px,var(--yellow) 20px);
    border:2px solid var(--ink);
  }
  .divider span { background:var(--ink); padding:6px 14px; border:3px solid var(--ink); box-shadow:4px 4px 0 rgba(17,17,17,.35); }
  .nb-tag {
    display:inline-block; background:var(--ink); color:var(--paper);
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    padding:4px 12px; margin-bottom:18px; font-weight:800;
  }
  .nb.orig > .nb-tag { background:var(--ink); color:var(--yellow); }
  .nb.summ > .nb-tag { background:var(--ink); color:var(--pink); }

  #md h1,#md h2,#md h3,#md h4,#md h5,#md h6 { margin:20px 0 10px; line-height:1.25; font-weight:900; }
  #md h1{font-size:27px} #md h2{font-size:21px} #md h3{font-size:17px} #md h4{font-size:15px}
  #md h2 { display:inline-block; background:var(--ink); color:var(--paper); padding:3px 10px; }
  #md p,#md li { margin:8px 0; } #md ul,#md ol { padding-left:26px; }
  #md li::marker { color:var(--ink); font-weight:900; }
  #md code { background:var(--ink); color:var(--yellow); padding:1px 6px; font-size:12.5px; font-weight:800; }
  #md pre { background:var(--ink); color:var(--paper); border:3px solid var(--ink); box-shadow:var(--shadow-sm); padding:14px; overflow:auto; margin:14px 0; }
  #md pre code { border:none; background:none; padding:0; color:inherit; }
  #md table { border-collapse:collapse; margin:14px 0; width:100%; background:var(--side); }
  #md th,#md td { border:3px solid var(--ink); padding:7px 11px; text-align:left; }
  #md th { background:var(--ink); color:var(--paper); text-transform:uppercase; font-size:12px; }
  #md blockquote { border:3px solid var(--ink); background:var(--side); box-shadow:var(--shadow-sm); padding:10px 16px; margin:14px 0; font-weight:700; }
  #md hr { border:none; border-top:4px solid var(--ink); margin:28px 0; }
  a { color:var(--ink); text-decoration:underline 3px; text-decoration-color:var(--pink); }
  a:hover { background:var(--pink); }
  .meta { display:inline-block; background:var(--side); border:3px solid var(--ink); box-shadow:var(--shadow-sm); padding:6px 12px; font-size:12px; margin-bottom:22px; font-weight:700; }

  /* floating edit pencil */
  #btn-edit {
    position:absolute; top:16px; right:16px; z-index:5;
    background:var(--yellow); border:3px solid var(--ink); color:var(--ink);
    width:42px; height:42px; cursor:pointer; font-size:17px;
    box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center;
  }
  #btn-edit:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  #btn-edit:active { transform:translate(3px,3px); box-shadow:none; }

  /* editor */
  #editor-bar { max-width:920px; margin:0 auto; padding:22px 26px 0; display:flex; gap:10px; justify-content:flex-end; }
  #editor-wrap { max-width:920px; margin:12px auto 40px; padding:0 26px; }
  #editor {
    width:100%; height:60vh; resize:vertical; background:var(--side); color:var(--ink);
    border:var(--bw) solid var(--ink); box-shadow:var(--shadow); padding:16px;
    font:13px/1.6 ui-monospace,"SF Mono",Menlo,monospace; outline:none; font-weight:700;
  }
  #editor:focus { background:#fffef9; }

  /* modal + toast */
  #modal-bg { position:fixed; inset:0; background:rgba(17,17,17,.55); display:none; align-items:center; justify-content:center; z-index:50; }
  #modal { background:var(--paper); border:var(--bw) solid var(--ink); box-shadow:10px 10px 0 var(--ink); padding:22px; width:min(430px,92vw); }
  #modal h3 { font-size:16px; text-transform:uppercase; margin-bottom:14px; }
  #modal input {
    width:100%; background:var(--side); color:var(--ink); border:3px solid var(--ink);
    padding:10px 12px; font-size:13px; outline:none; margin-bottom:8px; font-family:inherit; font-weight:700;
  }
  #modal input:focus { background:#fffef9; box-shadow:var(--shadow-sm); }
  #modal .hintline { color:var(--ink); opacity:.65; font-size:11.5px; margin-bottom:14px; }
  #modal .mrow { display:flex; gap:10px; justify-content:flex-end; }
  #toast {
    position:fixed; bottom:22px; right:22px; z-index:60; max-width:70vw;
    background:var(--lime); border:var(--bw) solid var(--ink); box-shadow:var(--shadow);
    padding:12px 16px; font-size:12.5px; display:none; word-break:break-word; font-weight:800;
  }
  #toast.err { background:var(--pink); }

  @media (max-width:800px) {
    #burger { display:block; }
    #sidebar { position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-105%); transition:transform .18s; }
    #sidebar.open { transform:none; box-shadow:14px 0 0 rgba(17,17,17,.25); }
    .nb { padding:20px 18px; transform:none !important; }
    .nb.summ { margin-top:26px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="side-head"><span>📁 Explorer · notes/</span><span id="cnt"></span></div>
  <div id="tree"><div class="row loading">Loading…</div></div>
  <div id="side-foot">
    <button id="b-newfile" title="New file in selected folder">+ FILE</button>
    <button id="b-newdir" title="New folder in selected folder">+ FOLDER</button>
    <button id="b-token" title="Set GitHub token (needed to save)">🔑</button>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <button id="burger">☰</button>
    <div id="crumb">notes/</div>
    <span id="actions"></span>
  </div>
  <div id="view">
    <div id="md" class="welcome"></div>
  </div>
</div>

<div id="modal-bg">
  <div id="modal">
    <h3 id="m-title"></h3>
    <input id="m-input" type="text" autocomplete="off" />
    <div class="hintline" id="m-hint"></div>
    <div class="mrow">
      <button class="tbtn" id="m-cancel">Cancel</button>
      <button class="tbtn primary" id="m-ok">OK</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================ config / state ============================= */
const OWNER = location.hostname.split(".")[0];
const REPO = location.pathname.replace(/^\/+/, "").split("/")[0] || "ffcamp_extension";
const BRANCH = "main";
const ROOT = "docs/summaries";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const SPLIT = "<!--FFCAMP-SPLIT-->";

/* scrub classifier junk ("User Safety: safe", lone verdicts) from any note */
function scrub(t) {
  return String(t || "")
    .replace(/^\s*\*{0,2}(?:user\s+)?safety\b[^#\n]*$/gim, "")
    .replace(/^\s*(?:safe|unsafe|clean|harmless)\s*$/gim, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

let TOKEN = localStorage.getItem("ffcamp_token") || "";
let TREE = null;
let FLAT = new Map();
let EXPANDED = new Set([ROOT]);
let SELECTED = ROOT;
let CURRENT = null;
let DATES = new Map();   // path -> last commit ISO date
let datesBusy = false;

/* ================================ github ================================= */
function hdrs(extra = {}) {
  const h = { Accept: "application/vnd.github+json", ...extra };
  if (TOKEN) h.Authorization = "Bearer " + TOKEN;
  return h;
}
async function apiJson(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: hdrs(opts.headers || {}) });
  if (!r.ok) {
    const b = await r.json().catch(() => ({}));
    const msg = b.message || r.statusText;
    throw new Error(r.status === 401 || r.status === 403
      ? `${msg} — set a valid token via 🔑 (needs Contents: Read & write)`
      : `GitHub ${r.status}: ${msg}`);
  }
  return r.status === 204 ? null : r.json();
}
const encP = (p) => p.split("/").map(encodeURIComponent).join("/");
const b64u = (s) => {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

async function putFile(path, content, sha) {
  const body = { message: `notes: ${sha ? "update" : "create"} ${path}`, content: b64u(content), branch: BRANCH };
  if (sha) body.sha = sha;
  await apiJson(`${API}/contents/${encP(path)}`, { method: "PUT", body: JSON.stringify(body) });
}
async function delFile(path, sha) {
  await apiJson(`${API}/contents/${encP(path)}`, {
    method: "DELETE",
    body: JSON.stringify({ message: `notes: delete ${path}`, sha, branch: BRANCH })
  });
}

async function loadTree() {
  const j = await apiJson(`${API}/git/trees/${BRANCH}?recursive=1`);
  const blobs = (j.tree || []).filter((t) => t.type === "blob" && t.path.startsWith(ROOT + "/"));

  const rootNode = { type: "root", path: ROOT, name: "notes", children: [] };
  const dirIdx = new Map([[ROOT, rootNode]]);
  const mkdirp = (dp) => {
    if (dirIdx.has(dp)) return dirIdx.get(dp);
    const parts = dp.split("/");
    const nm = parts.pop();
    const parent = parts.join("/") === ROOT ? rootNode : mkdirp(parts.join("/"));
    const node = { type: "dir", path: dp, name: nm, children: [] };
    dirIdx.set(dp, node);
    parent.children.push(node);
    return node;
  };

  for (const t of blobs) {
    const parts = t.path.split("/");
    const nm = parts.pop();
    const dp = parts.join("/");
    const parent = dp === ROOT ? rootNode : mkdirp(dp);
    parent.children.push({ type: "file", path: t.path, name: nm, sha: t.sha });
  }

  const sortRec = (n) => {
    n.children.sort((a, b) => {
      if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
      if (a.type === "file") {
        const da = DATES.get(a.path), db = DATES.get(b.path);
        if (da || db) {
          const ta = da ? Date.parse(da) : 0, tb = db ? Date.parse(db) : 0;
          if (ta !== tb) return tb - ta; // newest first
        }
      }
      return a.name.localeCompare(b.name);
    });
    n.children.forEach((c) => c.type === "dir" && sortRec(c));
  };
  sortRec(rootNode);

  TREE = rootNode;
  FLAT = new Map();
  (function walk(n) {
    n.children.forEach((c) => {
      FLAT.set(c.path, c);
      if (c.type === "dir") walk(c);
    });
  })(TREE);
}

/* ============================== rendering ================================ */
const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function fileIcon(name) {
  return /\.md$/i.test(name) ? "📄" : /\.(png|jpe?g|gif|svg)$/i.test(name) ? "🖼" : "📄";
}

function renderTree() {
  const el = $("tree");
  if (!TREE) return;
  let count = 0;
  (function cnt(n) {
    n.children.forEach((c) => { if (c.type === "file") count++; else cnt(c); });
  })(TREE);
  const hasKeep = (n) => n.children.some((c) => c.name === ".gitkeep");

  function html(node, depth) {
    let out = "<ul>";
    for (const c of node.children) {
      if (c.type === "dir") {
        const open = EXPANDED.has(c.path);
        out += `<li><div class="row${SELECTED === c.path ? " sel" : ""}" data-dir="${esc(c.path)}">
          <span class="chev">${open ? "▼" : "▶"}</span><span class="ico">${open ? "📂" : "📁"}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="acts">
            <button data-act="rename" data-path="${esc(c.path)}" title="Rename">✏️</button>
            <button data-act="del" data-path="${esc(c.path)}" title="Delete">🗑️</button>
          </span></div>`;
        out += `<ul ${open ? "" : "hidden"}>`;
        if (!c.children.length && !hasKeep(c))
          out += `<li><div class="row" style="opacity:.5;cursor:default"><span class="chev"></span><span class="ico">·</span><span class="nm">empty</span></div></li>`;
        out += html(c, depth + 1);
        out += "</ul></li>";
      } else {
        if (depth === 0 && c.name === "README.md" && c.path.endsWith("summaries/README.md")) continue;
        out += `<li><div class="row${CURRENT?.path === c.path ? " sel" : ""}" data-file="${esc(c.path)}">
          <span class="chev"></span><span class="ico">${fileIcon(c.name)}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="acts">
            <button data-act="rename" data-path="${esc(c.path)}" title="Rename">✏️</button>
            <button data-act="del" data-path="${esc(c.path)}" title="Delete">🗑️</button>
          </span></div></li>`;
      }
    }
    return out + "</ul>";
  }

  el.innerHTML = html(TREE, 0);
  $("cnt").textContent = `${count} file${count === 1 ? "" : "s"}`;
}

function setCrumb(path) {
  if (!path) { $("crumb").innerHTML = "<b>NOTES/</b>"; return; }
  const rel = path.startsWith(ROOT + "/") ? path.slice(ROOT.length + 1) : path;
  $("crumb").innerHTML = `<b>NOTES/</b>${esc(rel)}`;
}

/* ============================== main views =============================== */
function showWelcome() {
  CURRENT = null;
  EDITING = false;
  cleanupEditor();
  $("actions").innerHTML = "";
  setCrumb("");
  const md = $("md");
  md.hidden = false;
  md.className = "welcome";
  md.innerHTML = `
    <h2>📚 Your study notes live here</h2>
    <p>Pick a file from the explorer, or create one with <code>+ FILE</code>.</p>
    <p>Summaries you save from the FFCamp browser extension appear automatically in this workspace.</p>
    <p>To rename / delete / create, hover items in the sidebar. Writes need a token once — tap <code>🔑</code>.</p>`;
}

async function openFile(path) {
  try {
    toast(`Opening ${path.split("/").pop()}…`);
    const node = FLAT.get(path);
    const r = await fetch(`${RAW}/${encP(path)}?t=${Date.now()}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    CURRENT = { path, sha: node?.sha ?? null, raw: await r.text(), isNew: false };
    EDITING = false;
    renderView();
  } catch (e) {
    toast(e.message, "err");
  }
}

let EDITING = false;
  /* split into Original Content box + AI Summary box
     (new format uses <!--FFCAMP-SPLIT-->; legacy notes are detected via
     the analysis heading or a --- rule) */
  function splitVariations(rawRaw) {
    const raw = scrub(rawRaw);
    const idx = raw.indexOf(SPLIT);
    if (idx >= 0) return [raw.slice(0, idx), raw.slice(idx + SPLIT.length)];
    const aiIdx = raw.search(/^## What the topic is explaining/m);
    if (aiIdx > 0) return [raw.slice(0, aiIdx), raw.slice(aiIdx)];
    const hr = raw.indexOf("\n---\n");
    if (hr > 0) return [raw.slice(0, hr), raw.slice(hr + 5)];
    return [raw, null];
  }

  function renderView() {
    const md = $("md");
    $("actions").innerHTML = "";

    if (EDITING) {
      setCrumb(CURRENT.path + " (editing)");
      md.hidden = true;
      cleanupEditor();
      let bar = document.createElement("div"); bar.id = "editor-bar";
      let wrap = document.createElement("div"); wrap.id = "editor-wrap";
      bar.innerHTML =
        '<button class="tbtn" id="e-cancel">Cancel</button>' +
        '<button class="tbtn primary" id="e-save">💾 Save (Ctrl+S)</button>';
      wrap.innerHTML = '<textarea id="editor" spellcheck="false"></textarea>';
      $("view").appendChild(bar); $("view").appendChild(wrap);
      $("editor").value = CURRENT.raw;
      $("e-save").onclick = saveEditing;
      $("e-cancel").onclick = () => {
        EDITING = false;
        cleanupEditor();
        if (CURRENT.isNew) showWelcome(); else renderView();
      };
      setTimeout(() => $("editor").focus(), 30);
      return;
    }

    cleanupEditor();
    md.hidden = false;
    md.className = "";
    setCrumb(CURRENT?.path);

    const [rawA, rawB] = splitVariations(CURRENT.raw);

    md.innerHTML =
      `<blockquote class="meta">${esc(CURRENT.path.split("/").pop())}</blockquote>` +
      `<section class="nb orig"><span class="nb-tag">Box 1 · Original Content · as scraped</span>${marked.parse(rawA || "*nothing scraped*")}</section>` +
      (rawB != null
        ? `<div class="divider"><span>⚡ AI Analysis ⚡</span></div>` +
          `<section class="nb summ"><span class="nb-tag">Box 2 · Study Analysis · by AI</span>${marked.parse(rawB.trim() ? rawB : "_No AI section in this note._")}</section>`
        : "") +
      '<button id="btn-edit" title="Edit this file">✏️</button>';
    $("btn-edit").onclick = startEditing;
  }

function cleanupEditor() {
  const b = $("editor-bar"), w = $("editor-wrap");
  if (b) b.remove(); if (w) w.remove();
}

function startEditing() {
  if (!CURRENT) return;
  EDITING = true;
  renderView();
}

async function saveEditing() {
  const text = $("editor").value;
  try {
    btnBusy(true);
    if (CURRENT.isNew) CURRENT.path = `${SELECTED || ROOT}/${CURRENT.newName}`;
    await putFile(CURRENT.path, text, CURRENT.sha);
    toast("Saved ✓", "ok");
    EDITING = false;
    CURRENT.isNew = false;
    await refresh();
    await openFile(CURRENT.path);
  } catch (e) {
    toast(e.message, "err");
  } finally {
    btnBusy(false);
  }
}
function btnBusy(b) {
  const s = $("e-save");
  if (s) { s.disabled = b; s.textContent = b ? "Saving…" : "💾 Save (Ctrl+S)"; }
}

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && EDITING) {
    e.preventDefault(); saveEditing();
  }
});

/* ============================== operations =============================== */
function refresh() {
  datesBusy = false; // re-hydrate dates for newly added files
  return loadTree().then(renderTree).then(hydrateDates);
}

/* fetch last-commit date per file (newest-first sorting) */
async function hydrateDates() {
  if (datesBusy || !FLAT.size) return;
  datesBusy = true;
  const files = [...FLAT.values()].filter((f) => f.type === "file" && f.path.startsWith(ROOT + "/"));
  for (const f of files) {
    if (DATES.has(f.path)) continue;
    try {
      const arr = await apiJson(`${API}/commits?path=${encodeURIComponent(f.path)}&per_page=1`);
      if (arr && arr[0]) DATES.set(f.path, arr[0].commit.author.date);
    } catch (e) {
      break; // rate-limited or offline: keep alpha order quietly
    }
  }
  datesBusy = false;
  await loadTree();
  renderTree();
}

function ask(title, defVal, hint) {
  return new Promise((resolve) => {
    $("m-title").textContent = title;
    $("m-hint").textContent = hint || "";
    const inp = $("m-input");
    inp.value = defVal || "";
    $("modal-bg").style.display = "flex";
    inp.focus(); inp.select();
    const done = (v) => {
      $("modal-bg").style.display = "none";
      $("m-ok").onclick = null; $("m-cancel").onclick = null; inp.onkeydown = null;
      resolve(v);
    };
    $("m-ok").onclick = () => done(inp.value.trim());
    $("m-cancel").onclick = () => done(null);
    inp.onkeydown = (e) => {
      if (e.key === "Enter") done(inp.value.trim());
      if (e.key === "Escape") done(null);
    };
  });
}

async function newFile() {
  const name = await ask("New file (in " + (SELECTED || ROOT).replace(ROOT + "/", "") + "/)", "", "e.g. my-notes.md");
  if (!name) return;
  CURRENT = { path: `${SELECTED || ROOT}/${name}`, sha: null, raw: "", isNew: true, newName: name };
  EDITING = true;
  renderView();
  toast("Write something, then Save to commit.", "ok");
}

async function newFolder() {
  const name = await ask("New folder (in " + (SELECTED || ROOT).replace(ROOT + "/", "") + "/)", "", "created with a .gitkeep placeholder");
  if (!name) return;
  try {
    await putFile(`${SELECTED || ROOT}/${name}/.gitkeep`, "# placeholder\n");
    EXPANDED.add(SELECTED || ROOT);
    await refresh();
    toast(`Folder "${name}" created ✓`, "ok");
  } catch (e) { toast(e.message, "err"); }
}

async function renameItem(path) {
  const node = FLAT.get(path);
  if (!node) return;
  const newName = await ask(`Rename ${node.type}`, node.name, "");
  if (!newName || newName === node.name) return;
  const parent = path.split("/").slice(0, -1).join("/");
  const target = `${parent}/${newName}`;
  try {
    if (node.type === "file") {
      const r = await fetch(`${RAW}/${encP(path)}`);
      await putFile(target, await r.text(), node.sha);
      await delFile(path, node.sha);
    } else {
      const files = [...FLAT.values()].filter((f) => f.type === "file" && f.path.startsWith(path + "/"));
      if (!files.length) throw new Error("folder has no files to move");
      let i = 0;
      for (const f of files) {
        i++;
        toast(`Moving ${i}/${files.length}: ${f.name}…`);
        const r = await fetch(`${RAW}/${encP(f.path)}`);
        await putFile(target + f.path.slice(path.length), await r.text(), f.sha);
        await delFile(f.path, f.sha);
      }
      if (EXPANDED.has(path)) { EXPANDED.delete(path); EXPANDED.add(target); }
    }
    await refresh();
    toast("Renamed ✓", "ok");
  } catch (e) { toast(e.message, "err"); }
}

async function deleteItem(path) {
  const node = FLAT.get(path);
  if (!node) return;
  const label = node.type === "dir" ? `folder "${node.name}" and EVERYTHING inside` : `"${node.name}"`;
  if (!confirm(`Delete ${label}? This cannot be undone.`)) return;
  try {
    if (node.type === "file") {
      await delFile(path, node.sha);
    } else {
      const files = [...FLAT.values()].filter((f) => f.type === "file" && f.path.startsWith(path + "/"));
      let i = 0;
      for (const f of files) {
        i++;
        toast(`Deleting ${i}/${files.length}…`);
        await delFile(f.path, f.sha);
      }
      if (CURRENT?.path?.startsWith(path + "/")) showWelcome();
    }
    await refresh();
    toast("Deleted ✓", "ok");
  } catch (e) { toast(e.message, "err"); }
}

/* =============================== events ================================== */
$("tree").addEventListener("click", (e) => {
  const actBtn = e.target.closest("button[data-act]");
  if (actBtn) {
    e.stopPropagation();
    const p = actBtn.dataset.path;
    actBtn.dataset.act === "rename" ? renameItem(p) : deleteItem(p);
    return;
  }
  const dirRow = e.target.closest(".row[data-dir]");
  if (dirRow) {
    SELECTED = dirRow.dataset.dir;
    EXPANDED.has(SELECTED) ? EXPANDED.delete(SELECTED) : EXPANDED.add(SELECTED);
    renderTree();
    return;
  }
  const fileRow = e.target.closest(".row[data-file]");
  if (fileRow) {
    SELECTED = fileRow.dataset.file.split("/").slice(0, -1).join("/") || ROOT;
    renderTree();
    openFile(fileRow.dataset.file);
    closeMobileSidebar();
  }
});

$("b-newfile").onclick = newFile;
$("b-newdir").onclick = newFolder;

$("b-token").onclick = async () => {
  const t = await ask("GitHub token", TOKEN, "Fine-grained or classic, with Contents: Read & write. Stored only in your browser.");
  if (t === null) return;
  TOKEN = t;
  localStorage.setItem("ffcamp_token", t);
  tokDot();
  toast(t ? "Token saved ✓" : "Token cleared", "ok");
};
function tokDot() { $("tok-dot")?.remove(); $("b-token").textContent = TOKEN ? "🔑●" : "🔑"; }

$("burger").onclick = () => $("sidebar").classList.toggle("open");
function closeMobileSidebar() { if (innerWidth <= 800) $("sidebar").classList.remove("open"); }

let toastTimer;
function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = kind || "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), kind === "err" ? 7000 : 3000);
}

/* ================================ boot =================================== */
(function boot() {
  tokDot();
  const params = new URLSearchParams(location.search);
  let target = params.get("p");
  if (!target) { const f = params.get("f"); if (f) target = `${ROOT}/${f}`; }

  loadTree()
    .then(() => {
      renderTree();
      hydrateDates();
      if (target && FLAT.has(target)) {
        const parts = target.split("/");
        SELECTED = parts.slice(0, -1).join("/") || ROOT;
        while (parts.length > 1) { EXPANDED.add(parts.join("/")); parts.pop(); }
        renderTree();
        openFile(target);
      } else if (target) {
        renderTree();
        showWelcome();
        toast(`"${target}" not found`, "err");
      } else showWelcome();
    })
    .catch((e) => {
      $("tree").innerHTML = `<div class="row" style="color:#a00">${esc(e.message)}</div>`;
      showWelcome();
    });
})();
</script>
</body>
